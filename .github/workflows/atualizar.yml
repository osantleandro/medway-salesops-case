name: Atualizar dados e dashboard

on:
  schedule:
    - cron: "17 9 * * *"   # todo dia às 06:17 (Brasília)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["pipeline/**", "data/raw/b2c_vendas.csv", ".github/workflows/**", "dashboard/**"]

permissions:
  contents: write

concurrency:
  group: atualizar
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Coletar B2B (API)
        env:
          MEDWAY_B2B_TOKEN: ${{ secrets.MEDWAY_B2B_TOKEN }}
        run: python pipeline/fetch_b2b.py

      - name: Gravar no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "dados: atualização automática $(date -u +%F)"
          git push
